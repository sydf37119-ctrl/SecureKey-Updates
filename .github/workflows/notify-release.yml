
name: SecureKey Automatic Update Notifications

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-users:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate with Firebase
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.auth.outputs.project_id }}

      - name: Send update notification
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'test' }}
          RELEASE_NAME: ${{ github.event.release.name || 'اختبار إشعارات SecureKey' }}
          RELEASE_URL: ${{ github.event.release.html_url || 'https://github.com/sydf37119-ctrl/SecureKey-Updates/releases' }}

        run: |
          set -e

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          BODY="$(jq -n \
            --arg title "تحديث جديد لتطبيق SecureKey" \
            --arg body "يتوفر إصدار جديد ${RELEASE_NAME}. اضغط لمعرفة التفاصيل وتنزيله." \
            --arg version "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            '{
              message: {
                topic: "securekey_updates",
                data: {
                  type: "app_update",
                  title: $title,
                  body: $body,
                  version: $version,
                  release_url: $url
                },
                android: {
                  priority: "HIGH",
                  ttl: "2419200s",
                  collapse_key: "securekey-update"
                }
              }
            }')"

          RESPONSE="$(curl -sS -X POST \
            "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$BODY")"

          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.name' >/dev/null

          echo "SecureKey notification sent successfully."
