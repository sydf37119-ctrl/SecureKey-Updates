
name: SecureKey Automatic Update Notifications

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-users:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate with Firebase
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.auth.outputs.project_id }}

      - name: Send update notification to all SecureKey users
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          BODY="$(jq -n \
            --arg title "تحديث جديد لتطبيق SecureKey" \
            --arg body "يتوفر الآن ${RELEASE_NAME:-$RELEASE_TAG}. اضغط لمعرفة التحديث وتنزيله." \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            '{
              message: {
                topic: "securekey_updates",
                notification: {
                  title: $title,
                  body: $body
                },
                data: {
                  type: "app_update",
                  version: $tag,
                  release_url: $url
                },
                android: {
                  priority: "HIGH",
                  notification: {
                    channel_id: "securekey_updates",
                    click_action: "OPEN_SECUREKEY_UPDATES",
                    tag: "securekey-release"
                  }
                }
              }
            }')"

          RESPONSE="$(curl -sS -X POST \
            "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$BODY")"

          echo "$RESPONSE"

          echo "$RESPONSE" | jq -e '.name' >/dev/null
